name: Tests

on:
  push:
  pull_request:

# tests only read the code (and pull requests from forks never get write access or secrets)
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: App self-test (from source)
        run: python cfs_app.py --self-test
